<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="htmx-config" content='{"includeIndicatorStyles": false, "allowEval": false, "allowScriptTags": false, "historyCacheSize": 0}'>
  <title>{% block title %}Device Report{% endblock %} · Siscom</title>
  <link rel="icon" href="{{ url_for('static', path='favicon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}?v={{ app_version }}">
  <script src="{{ url_for('static', path='htmx.min.js') }}?v=2.0.4" defer></script>
</head>
<body hx-indicator="#global-indicator">
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 20h8M12 16v4M7 12l3-3 2 2 4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Device Report</span>
      </a>
      {% if user %}
      <nav class="nav" aria-label="Principal">
        <a href="/" {% if nav == 'inicio' %}aria-current="page"{% endif %}>Inicio</a>
        <a href="/reportes" {% if nav == 'reportes' %}aria-current="page"{% endif %}>Reportes</a>
      </nav>
      <form method="post" action="/logout" class="logout">
        <span class="muted user">{{ user }}</span>
        <button type="submit" class="btn btn-ghost btn-sm">Salir</button>
      </form>
      {% endif %}
    </div>
    <div class="progress htmx-indicator" id="global-indicator" aria-hidden="true"></div>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="footer muted">Device Report v{{ app_version }} · Siscom</footer>
</body>
</html>
